<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NewsFlow</title>
<style>
  :root {
    --bg: #0f0f13;
    --bg2: #1a1a24;
    --bg3: #22222f;
    --card: #1e1e2a;
    --card-hover: #252535;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --text: #f0f0f5;
    --text2: #9999bb;
    --text3: #666688;
    --border: #2a2a3d;
    --world: #3b82f6;
    --soccer: #22c55e;
    --sports: #f59e0b;
    --trends: #ec4899;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: 80px;
  }

  /* Header */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: linear-gradient(180deg, var(--bg) 80%, transparent 100%);
    padding: 16px 20px 12px;
    backdrop-filter: blur(12px);
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .logo {
    font-size: 24px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
  }
  .header-date {
    font-size: 12px;
    color: var(--text3);
  }
  .refresh-btn {
    background: var(--bg3);
    border: none;
    color: var(--text2);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    font-size: 16px;
  }
  .refresh-btn:active { transform: scale(0.9); }
  .refresh-btn.spinning { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Category tabs */
  .tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0;
    padding: 7px 16px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text2);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tab.active {
    border-color: transparent;
    color: #fff;
  }
  .tab[data-cat="all"].active    { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .tab[data-cat="world"].active  { background: var(--world); }
  .tab[data-cat="soccer"].active { background: var(--soccer); }
  .tab[data-cat="sports"].active { background: var(--sports); }
  .tab[data-cat="trends"].active { background: var(--trends); }

  /* Feed */
  .feed {
    padding: 8px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Date divider */
  .date-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 0;
  }
  .date-divider span {
    font-size: 11px;
    font-weight: 700;
    color: var(--text3);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .date-divider::before, .date-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Article card */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid var(--border);
    text-decoration: none;
    display: block;
    color: inherit;
  }
  .card:active { transform: scale(0.98); background: var(--card-hover); }

  .card-featured {
    position: relative;
  }
  .card-featured .card-img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    display: block;
  }
  .card-featured .card-img-placeholder {
    width: 100%;
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    background: var(--bg3);
  }
  .card-featured .card-body {
    padding: 14px 16px 16px;
  }

  .card-compact {
    display: flex;
    gap: 12px;
    padding: 14px;
    align-items: flex-start;
  }
  .card-compact .card-thumb {
    width: 80px;
    height: 80px;
    border-radius: 10px;
    object-fit: cover;
    flex-shrink: 0;
  }
  .card-compact .card-thumb-placeholder {
    width: 80px;
    height: 80px;
    border-radius: 10px;
    background: var(--bg3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
  }
  .card-compact .card-body {
    flex: 1;
    min-width: 0;
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .cat-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 20px;
    letter-spacing: 0.3px;
  }
  .cat-world  { background: rgba(59,130,246,0.2);  color: #60a5fa; }
  .cat-soccer { background: rgba(34,197,94,0.2);   color: #4ade80; }
  .cat-sports { background: rgba(245,158,11,0.2);  color: #fbbf24; }
  .cat-trends { background: rgba(236,72,153,0.2);  color: #f472b6; }

  .source-name {
    font-size: 11px;
    color: var(--text3);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .card-title {
    font-size: 14px;
    font-weight: 700;
    line-height: 1.5;
    margin-bottom: 5px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-featured .card-title {
    font-size: 16px;
    -webkit-line-clamp: 2;
  }
  .card-summary {
    font-size: 12px;
    color: var(--text2);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-time {
    font-size: 11px;
    color: var(--text3);
    margin-top: 6px;
  }

  /* Bottom nav */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: rgba(15,15,19,0.9);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    padding: 10px 0 20px;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    padding: 4px 20px;
    color: var(--text3);
    transition: color 0.2s;
    font-size: 18px;
  }
  .nav-item.active { color: var(--accent); }
  .nav-item span { font-size: 10px; font-weight: 600; }

  /* Loading */
  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    gap: 16px;
    color: var(--text3);
  }
  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  /* Error / Empty */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text3);
  }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-text { font-size: 14px; }

  /* Toast */
  .toast {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--bg3);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: var(--shadow);
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 999;
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <div class="logo">NewsFlow</div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="header-date" id="headerDate"></div>
      <button class="refresh-btn" id="refreshBtn" onclick="refresh()">↻</button>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-cat="all"     onclick="setCategory('all')">すべて</button>
    <button class="tab"        data-cat="world"   onclick="setCategory('world')">🌍 世界情勢</button>
    <button class="tab"        data-cat="soccer"  onclick="setCategory('soccer')">⚽ サッカー</button>
    <button class="tab"        data-cat="sports"  onclick="setCategory('sports')">⚾ スポーツ</button>
    <button class="tab"        data-cat="trends"  onclick="setCategory('trends')">🔥 SNSトレンド</button>
  </div>
</header>

<main class="feed" id="feed"></main>

<nav class="bottom-nav">
  <div class="nav-item active">
    <span>🏠</span><span>ホーム</span>
  </div>
  <div class="nav-item">
    <span>🔍</span><span>検索</span>
  </div>
  <div class="nav-item">
    <span>🔔</span><span>通知</span>
  </div>
  <div class="nav-item">
    <span>👤</span><span>マイ</span>
  </div>
</nav>

<div class="toast" id="toast"></div>

<script>
let currentCategory = 'all';
let allArticles = [];

const CATEGORY_EMOJI = {
  world: '🌍', soccer: '⚽', sports: '⚾', trends: '🔥'
};

function formatDate(isoStr) {
  const d = new Date(isoStr);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return 'たった今';
  if (diff < 3600) return `${Math.floor(diff/60)}分前`;
  if (diff < 86400) return `${Math.floor(diff/3600)}時間前`;
  if (diff < 172800) return '昨日';
  return `${d.getMonth()+1}月${d.getDate()}日`;
}

function formatDateGroup(isoStr) {
  const d = new Date(isoStr);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const yesterday = new Date(today); yesterday.setDate(today.getDate()-1);
  const articleDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  if (articleDay.getTime() === today.getTime()) return '今日';
  if (articleDay.getTime() === yesterday.getTime()) return '昨日';
  return `${d.getMonth()+1}月${d.getDate()}日`;
}

function getCatClass(cat) {
  return `cat-${cat}`;
}

function renderArticle(article, index) {
  const emoji = CATEGORY_EMOJI[article.category] || '📰';
  const timeStr = formatDate(article.published);
  const catLabel = article.category_label;
  const catClass = getCatClass(article.category);
  const isFeatured = index % 5 === 0;

  if (isFeatured) {
    return `
    <a class="card card-featured" href="${article.link}" target="_blank" rel="noopener">
      ${article.image
        ? `<img class="card-img" src="${article.image}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        : ''}
      <div class="card-img-placeholder" style="${article.image ? 'display:none' : ''}">${emoji}</div>
      <div class="card-body">
        <div class="card-meta">
          <span class="cat-badge ${catClass}">${catLabel}</span>
          <span class="source-name">${article.source}</span>
        </div>
        <div class="card-title">${article.title}</div>
        ${article.summary ? `<div class="card-summary">${article.summary}</div>` : ''}
        <div class="card-time">${timeStr}</div>
      </div>
    </a>`;
  }

  return `
  <a class="card card-compact" href="${article.link}" target="_blank" rel="noopener">
    ${article.image
      ? `<img class="card-thumb" src="${article.image}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      : ''}
    <div class="card-thumb-placeholder" style="${article.image ? 'display:none' : ''}">${emoji}</div>
    <div class="card-body">
      <div class="card-meta">
        <span class="cat-badge ${catClass}">${catLabel}</span>
        <span class="source-name">${article.source}</span>
      </div>
      <div class="card-title">${article.title}</div>
      <div class="card-time">${timeStr}</div>
    </div>
  </a>`;
}

function renderFeed(articles) {
  const feed = document.getElementById('feed');
  if (!articles || articles.length === 0) {
    feed.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📭</div>
        <div class="empty-text">ニュースを取得できませんでした</div>
      </div>`;
    return;
  }

  let html = '';
  let lastGroup = null;
  articles.forEach((article, i) => {
    const group = formatDateGroup(article.published);
    if (group !== lastGroup) {
      html += `<div class="date-divider"><span>${group}</span></div>`;
      lastGroup = group;
    }
    html += renderArticle(article, i);
  });
  feed.innerHTML = html;
}

async function loadNews(cat) {
  const feed = document.getElementById('feed');
  feed.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <div>ニュースを読み込み中...</div>
    </div>`;

  try {
    const res = await fetch(`/api/news?category=${cat}`);
    const data = await res.json();
    allArticles = data.articles || [];
    renderFeed(allArticles);
  } catch (e) {
    feed.innerHTML = `
      <div class="empty">
        <div class="empty-icon">⚠️</div>
        <div class="empty-text">エラーが発生しました。<br>再度お試しください。</div>
      </div>`;
  }
}

function setCategory(cat) {
  currentCategory = cat;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.cat === cat);
  });
  loadNews(cat);
}

function refresh() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  loadNews(currentCategory).finally(() => {
    setTimeout(() => btn.classList.remove('spinning'), 600);
    showToast('更新しました');
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function updateHeaderDate() {
  const now = new Date();
  const opts = { month: 'long', day: 'numeric', weekday: 'short' };
  document.getElementById('headerDate').textContent =
    now.toLocaleDateString('ja-JP', opts);
}

updateHeaderDate();
loadNews('all');
</script>
</body>
</html>
